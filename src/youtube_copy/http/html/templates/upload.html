{% extends "base.html" %}{% block title %}Загрузка — ViewTube{% endblock %}{% block head %}<script src="/static/upload.js" defer></script>{% endblock %}
{% block content %}<div class="mx-auto max-w-3xl"><h1 class="mb-6 text-2xl font-bold">Загрузка видео</h1><div class="rounded-2xl border border-line bg-[#181818] p-5 sm:p-8"><p id="account" class="mb-5 text-sm text-zinc-400">Проверяем вход…</p><form id="upload-form" data-max-bytes="{{ max_bytes }}"><fieldset id="fields" disabled class="space-y-5 disabled:opacity-50"><label class="block text-sm">Название<input name="title" maxlength="200" required class="mt-2 w-full rounded-xl border border-line bg-yt px-4 py-3 outline-none focus:border-blue-500"></label><label class="block text-sm">Описание<textarea name="description" maxlength="5000" rows="5" class="mt-2 w-full rounded-xl border border-line bg-yt px-4 py-3 outline-none focus:border-blue-500"></textarea></label><label class="block text-sm">Видимость<select name="visibility" class="mt-2 w-full rounded-xl border border-line bg-yt px-4 py-3"><option value="private">Приватное</option><option value="public">Публичное</option></select></label><label class="grid min-h-44 cursor-pointer place-items-center rounded-2xl border-2 border-dashed border-line p-6 text-center hover:border-zinc-500"><span><span class="text-4xl">⇧</span><span class="mt-2 block font-medium">Выберите видеофайл</span><span class="mt-1 block text-xs text-zinc-500">MP4, MOV, WebM или MKV · до {{ (max_bytes / 1024 / 1024)|round(1) }} МиБ</span></span><input name="file" type="file" accept=".mp4,.mov,.webm,.mkv" required class="sr-only"></label><div class="flex gap-3"><button type="submit" class="rounded-full bg-blue-600 px-6 py-2.5 font-semibold hover:bg-blue-500">Загрузить</button><button id="cancel" type="button" disabled class="rounded-full bg-panel px-6 py-2.5 disabled:opacity-40">Отменить</button></div></fieldset></form><progress id="progress" max="100" value="0" class="mt-6 h-2 w-full accent-red"></progress><p id="status" class="mt-3 text-sm text-zinc-300" role="status" aria-live="polite">Выберите файл для загрузки.</p></div></div>{% endblock %}
