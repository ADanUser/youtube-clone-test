[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "youtube-copy"
version = "0.1.0"
description = "A modular-monolith video service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.1",
  "asyncpg==0.30.0",
  "boto3==1.43.126",
  "fastapi==0.162.2",
  "jinja2==3.1.6",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.20",
  "sqlalchemy[asyncio]==2.1.8",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
]

[project.scripts]
youtube-web = "youtube_copy.main:run"
youtube-worker = "youtube_copy.worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_copy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["youtube_copy"]
